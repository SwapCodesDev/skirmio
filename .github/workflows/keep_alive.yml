name: Keep Render App Active

on:
  schedule:
    # Runs every 12 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          # Replace the URL below with your live Render URL once deployed.
          # Alternatively, add a GitHub Repository Secret named RENDER_APP_URL.
          URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://skirmio.onrender.com/"
          fi
          echo "Pinging $URL..."
          curl -I -s "$URL" | head -n 1
